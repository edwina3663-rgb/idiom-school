<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三年級小學堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--serif:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",serif;--bg:#f6f0ea;--card:#fffdfa;--ink:#3a2f33;--sub:#85757a;--acc:#a4545f;--onacc:#fff;--acc2:#ecdcd6;--gold:#c2994f;--ok:#3f8f6b;--bad:#b84a5b;--tag:#f3e6cf;--line:#e7d9d1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a1c;--card:#2a2427;--ink:#f3e9e4;--sub:#b8a8ad;--acc:#e0909c;--onacc:#2a1a1f;--acc2:#3d3236;--gold:#dbb56b;--ok:#7fcfa5;--bad:#f0909f;--tag:#4a3f2a;--line:#3a3034}}
:root[data-theme="dark"]{--bg:#1e1a1c;--card:#2a2427;--ink:#f3e9e4;--sub:#b8a8ad;--acc:#e0909c;--onacc:#2a1a1f;--acc2:#3d3236;--gold:#dbb56b;--ok:#7fcfa5;--bad:#f0909f;--tag:#4a3f2a;--line:#3a3034}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.85}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:var(--serif);text-align:center;margin:10px 0 0;font-size:1.9rem;letter-spacing:.18em;font-weight:700}
h1::after{content:"";display:block;width:48px;height:2px;background:var(--gold);margin:10px auto 0}
.sub{text-align:center;color:var(--sub);margin:8px 0 14px;font-size:.95rem}
button,select,input{font:inherit}
nav{display:flex;gap:8px;justify-content:center;margin:12px 0}
nav button{padding:7px 20px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;cursor:pointer;letter-spacing:.08em}
nav button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.subj{display:flex;justify-content:center;margin:10px 0 2px}
.subj button{padding:5px 26px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;font-family:var(--serif);font-weight:700;letter-spacing:.2em}
.subj button:first-child{border-radius:999px 0 0 999px}.subj button:last-child{border-radius:0 999px 999px 0;border-left:0}
.subj button.on{background:var(--acc);color:var(--onacc)}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;min-height:28px}
.bar b{font-family:var(--serif)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin:14px 0;box-shadow:0 2px 12px rgba(90,60,60,.06)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 8px;cursor:pointer;text-align:center;box-shadow:0 1px 8px rgba(90,60,60,.05)}
.grid button:hover:not(:disabled){border-color:var(--acc)}
.grid button:disabled{opacity:.45;cursor:not-allowed}
.grid .em{display:block;font-family:var(--serif);font-size:.85rem;color:var(--sub);letter-spacing:.1em}
.grid b{font-family:var(--serif);font-size:1.25rem;letter-spacing:.1em}
.zy{color:var(--sub);font-size:.85rem;letter-spacing:.08em}
h2{font-family:var(--serif);margin:4px 0;font-size:2rem;letter-spacing:.15em;text-align:center}
.hd{text-align:center}
h3{font-family:var(--serif);margin:0 0 6px;font-size:1rem;letter-spacing:.12em;color:var(--acc);padding-left:10px;border-left:3px solid var(--gold)}
.tag{display:inline-block;background:var(--tag);border-radius:6px;padding:1px 10px;font-size:.8rem;margin:2px 8px 4px 0}
.back{background:none;border:none;color:var(--acc);cursor:pointer;padding:4px 0;font-size:.95rem}
.q p{margin:0 0 8px}
select,input[type=number]{padding:4px 10px;border-radius:10px;border:1px solid var(--acc);background:var(--bg);color:var(--ink)}
input[type=number]{font-size:1.3rem;width:8em;text-align:center;margin-right:8px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.go{padding:8px 24px;border:none;background:var(--acc);color:var(--onacc);border-radius:999px;cursor:pointer;margin-top:6px;letter-spacing:.1em}
.fb{margin-top:10px;font-size:.98rem}
.fb .ok{display:inline-block;animation:pop .4s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.score{text-align:center;font-size:1.2rem}
.st{color:var(--gold);letter-spacing:.12em}
.eq{font-family:var(--serif);font-size:1.5rem;text-align:center;margin:8px 0 14px;line-height:1.9}
.stars{font-weight:700}
.chips{display:flex;flex-wrap:wrap;justify-content:center;margin:8px 0 12px}
.chip{padding:4px 14px;margin:3px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--sub);cursor:pointer;font-size:.9rem}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.mk{margin:4px;opacity:1}
.pick{display:block;text-align:center}
.subj button+button{border-left:0}
.bk{width:100%;min-height:84px;box-sizing:border-box;font:12px/1.4 monospace;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:8px 0}
.vt{display:inline-block;font-family:var(--serif);font-size:1.6rem;margin:10px auto}
.vt .r{display:flex;justify-content:flex-end}
.vt .c{width:2.1em;height:2.3em;line-height:2.3em;text-align:center}
.vt .ln{border-top:2px solid var(--ink);margin-top:2px}
.dg{width:1.6em;height:1.6em;font:inherit;text-align:center;border:1.5px solid var(--acc);border-radius:6px;background:var(--bg);color:var(--ink);padding:0}
.dg.wr{border-color:var(--bad)}.dg.fix{border-color:var(--ok);color:var(--ok)}
.dg.ok2{border-color:var(--ok);color:var(--ok)}
.dg:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.bx{display:inline-block;width:1.3em;height:1.3em;line-height:1.3em;border:1.5px solid var(--acc);border-radius:6px;font-size:.9em}
</style>
</head>
<body>
<main>
<h1>三年級小學堂</h1>
<p class="sub">成語．數學　每天進步一點點</p>
<div id="bar" class="bar"></div>
<div id="subj" class="subj"></div>
<nav><button id="t1" class="on">闖關</button><button id="t2">認識成語</button><button id="t3">換裝</button></nav>
<div id="app"></div>
</main>
<script>
/* ===== 想新增成語：照下面格式在 IDIOMS 最後面多加一筆就好 =====
 e:圖示 w:成語 zy:注音 mean:意思
 o:{s:"出處",t:[典故段落]} 或 o:null 加 n:"沒有特定典故的說明"
 tg:三國故事的標籤 sg:[三國故事段落] use:用法 ex:[例句] tip:小提醒 */
const IDIOMS=[
{e:"🚣",w:"木已成舟",zy:"ㄇㄨˋ ㄧˇ ㄔㄥˊ ㄓㄡ",
mean:"樹木已經做成了船，比喻事情已經成為定局，沒辦法再改變了。",
o:null,n:"這個成語沒有特定的故事。教育部《成語典》記錄的早期用例出自清代小說《鏡花緣》。",
tg:"三國歷史小故事（幫助你記）",
sg:["赤壁之戰時，黃蓋把裝滿乾柴的火船駛向曹軍。當時風很大，曹軍的船又連在一起。","火一點起來，火船已經衝過去，曹軍再想補救也來不及，這就是「木已成舟」。"],
use:"用在事情已經做完、沒辦法挽回的時候。",
ex:["作業已經交給老師了，木已成舟，再擔心也沒有用。","花瓶已經打破了，木已成舟，我們一起想辦法補救吧。"],
tip:"事情還可以修改的時候，不能用喔！"},
{e:"✍️",w:"洋洋灑灑",zy:"ㄧㄤˊ ㄧㄤˊ ㄙㄚˇ ㄙㄚˇ",
mean:"形容文章或說話的篇幅很長，內容豐富，寫得很流暢。",
o:null,n:"這個成語沒有特定的故事。教育部《成語典》的解釋是形容言論或文章「長篇大論」。",
tg:"三國歷史小故事（幫助你記）",
sg:["袁紹想對付曹操，請文人陳琳寫了一篇〈為袁紹檄豫州〉。","陳琳一條一條寫出曹操的罪狀，寫了長長一篇，文字又流暢又有氣勢，這就是「洋洋灑灑」。"],
use:"主要用來形容寫文章、演講、說話，內容很多又很流暢。",
ex:["哥哥的日記洋洋灑灑，一次就寫了三大頁。","校長的演講洋洋灑灑，講了好多有趣的故事。"],
tip:"只寫一兩句話，就不能說洋洋灑灑喔！"},
{e:"🎒",w:"滿載而歸",zy:"ㄇㄢˇ ㄗㄞˋ ㄦˊ ㄍㄨㄟ",
mean:"裝了滿滿的東西回來，形容收穫很多。",
o:null,n:"這個成語沒有特定的故事。意思相近的說法「稛載而歸」，出現在古書《國語·齊語》裡。",
tg:"《三國演義》故事（幫助你記）",
sg:["孔明的二十條草船在大霧中靠近曹營，曹兵看不清楚，不停放箭，箭都插在草人身上。","船上插滿了箭，孔明帶著好多箭回來，真是「滿載而歸」。"],
use:"去玩、去採買、去做事，得到很多東西或收穫的時候。",
ex:["我們去果園採水果，大家都滿載而歸。","爸爸出海捕魚，滿載而歸。"],
tip:"可以是東西很多，也可以是收穫很多（例如學到很多）。"},
{e:"🙋",w:"當仁不讓",zy:"ㄉㄤ ㄖㄣˊ ㄅㄨˋ ㄖㄤˋ",
mean:"遇到應該做的事，就主動承擔，不推辭、不謙讓。",
o:{s:"《論語·衛靈公》",t:["孔子說：「當仁不讓於師。」意思是：遇到應該做的好事，就算是面對老師，也不需要客氣推讓。"]},
tg:"三國歷史小故事（幫助你記）",
sg:["長坂坡兵敗時，趙雲知道保護主公的家人是自己該做的事，衝進戰場，救出劉備的兒子阿斗和甘夫人。","遇到該做的事，就勇敢承擔，這就是「當仁不讓」。"],
use:"用在遇到該做的事，主動說「我來」的時候。",
ex:["班上需要有人當值日生，他當仁不讓，馬上舉手。","班長說：「這件事我來吧！」他真是當仁不讓。"],
tip:"要用在好的、應該做的事，不能用在搶東西喔。"},
{e:"🤩",w:"嘆為觀止",zy:"ㄊㄢˋ ㄨㄟˊ ㄍㄨㄢ ㄓˇ",
mean:"看到極好的事物，讚嘆到覺得已經好到極點，不用再看別的了。",
o:{s:"《左傳·襄公二十九年》",t:["吳國公子季札到魯國，欣賞各國的音樂和舞蹈。看到《韶箾》舞時，他說「觀止矣」，意思是已經好到極點了，如果還有別的，也不敢再請你們表演了。","後來人們就用「嘆為觀止」，形容事物好到極點。"]},
tg:"《三國演義》故事（幫助你記）",
sg:["赤壁大戰前，孔明在七星壇上祭風。壇上風一吹起來，東南風真的來了。","在旁邊看的人都驚訝極了，覺得太神奇，簡直嘆為觀止。"],
use:"看到很棒的表演、風景或作品，讚美到說不出話的時候。",
ex:["魔術師的表演精彩極了，讓大家嘆為觀止。","這座橋設計得太漂亮，讓人嘆為觀止。"],
tip:"是讚美「很好」，不是形容「很糟」喔。"},
{e:"🐭",w:"投鼠忌器",zy:"ㄊㄡˊ ㄕㄨˇ ㄐㄧˋ ㄑㄧˋ",
mean:"想打老鼠，又怕打壞旁邊的器物，比喻做事有顧慮，不敢放手去做。",
o:{s:"《漢書·賈誼傳》",t:["賈誼引用一句民間的諺語：「欲投鼠而忌器」。意思是：老鼠躲在珍貴的器物旁邊，人想丟東西打牠，又怕把器物打壞。"]},
tg:"《三國演義》故事（幫助你記）",
sg:["曹操打獵時，身邊跟著皇帝。關羽很生氣，想殺曹操。","劉備攔住他，說「投鼠忌器」：曹操身邊有皇帝，動手可能會傷到皇帝，不能亂來。"],
use:"想解決問題，卻怕波及旁邊重要的人事物時。",
ex:["小偷躲在花瓶旁，警察投鼠忌器，不敢隨便動手。","他很想罵弟弟，又怕吵醒睡覺的寶寶，只好投鼠忌器。"],
tip:"重點是「有顧慮」，不是害怕。"},
{e:"🎵",w:"餘音繞樑",zy:"ㄩˊ ㄧㄣ ㄖㄠˋ ㄌㄧㄤˊ",
mean:"美妙的聲音消失後，好像還在屋樑上繞著，形容歌聲或音樂動聽，讓人久久難忘。",
o:{s:"《宋書·樂志》等古書",t:["古書記載：有位叫韓娥的女歌手，路過齊國，糧食吃完了，就在城門邊唱歌換飯吃。","她離開後，大家覺得歌聲還在屋樑上繞了三天。後來就用「餘音繞樑」形容動聽的聲音久久不散。"]},
tg:"《三國演義》例子（幫助你記）",
sg:["空城計裡，孔明坐在城樓上彈琴，琴聲傳得很遠。","城外的司馬懿聽著琴聲，覺得琴聲一直繞在耳邊，讓他更不敢進城。"],
use:"形容歌聲、樂聲很好聽，結束了還讓人回味的時候。",
ex:["她的歌聲餘音繞樑，大家聽完都還在回味。","音樂會結束了，鋼琴聲仍然餘音繞樑。"],
tip:"用來形容好聽的聲音，噪音不能用喔。"},
{e:"🙈",w:"咎由自取",zy:"ㄐㄧㄡˋ ㄧㄡˊ ㄗˋ ㄑㄩˇ",
mean:"壞的結果是自己造成的，怪不了別人。",
o:null,n:"這個成語沒有找到特定的典故，我們就直接看意思和故事吧。",
tg:"《三國演義》故事（幫助你記）",
sg:["馬謖守街亭時，副將王平勸他，要守在要道上。馬謖不聽，偏偏把軍隊帶上山。","結果被魏軍包圍，蜀軍大敗。這是他自己不聽勸造成的，就是「咎由自取」。"],
use:"用在壞結果是自己不聽勸、做錯事造成的時候。",
ex:["他考試前都在玩，成績不好是咎由自取。","不聽老師的提醒就跑去玩水，感冒了也是咎由自取。"],
tip:"帶有責備的意思，別隨便用在別人身上。"},
{e:"🐰",w:"撲朔迷離",zy:"ㄆㄨ ㄕㄨㄛˋ ㄇㄧˊ ㄌㄧˊ",
mean:"事情很複雜，讓人分不清真假、看不出真相。",
o:{s:"〈木蘭詩〉",t:["〈木蘭詩〉裡有這樣的句子：雄兔的腳撲朔（容易亂動），雌兔的眼睛迷離（容易瞇起來）。","兩隻兔子一起跑的時候，就分不出誰是雄、誰是雌。後來人們用「撲朔迷離」形容事情複雜難辨。"]},
tg:"《三國演義》故事（幫助你記）",
sg:["空城計裡，司馬懿看見城門大開，孔明在城樓上彈琴。","他搞不清楚是真的沒人，還是有埋伏，心裡一團亂，這就是「撲朔迷離」。這是小說裡的故事，歷史上並沒有這一段喔！"],
use:"用在事情很難看清真相、很難判斷的時候。",
ex:["這個案件撲朔迷離，誰也猜不出兇手是誰。","魔術師的手法撲朔迷離，我看不出是怎麼變的。"],
tip:"重點是「分不清」，不只是「很難」。"},
{e:"🐴",w:"塞翁失馬",zy:"ㄙㄞˋ ㄨㄥ ㄕ ㄇㄚˇ",
mean:"一時的壞事，說不定後來變成好事，比喻好壞可以互相轉變。",
o:{s:"《淮南子·人間訓》",t:["邊塞有位老人，他的馬跑丟了，鄰居都替他難過，他卻說：說不定是好事。","後來馬帶著別的好馬回來了；他的兒子騎馬摔斷了腿。一年後打仗，年輕人大多戰死，只有兒子因為腿受傷沒有上戰場，平安活了下來。"]},
tg:"《三國演義》故事（幫助你記）",
sg:["赤壁之戰前，周瑜當眾打了老將黃蓋，黃蓋被打得很慘，看起來是壞事。","可是這個苦肉計，讓黃蓋能假裝投降曹操，幫了大忙。壞事變成好事，就像塞翁失馬。"],
use:"用來安慰別人，或提醒自己：現在的壞事可能是好事的開始。",
ex:["比賽輸了不要難過，塞翁失馬，焉知非福。","這次沒選上，塞翁失馬，也許有更適合你的機會。"],
tip:"常搭配「焉知非福」（怎麼知道不是好事）一起用。"},
{e:"🎭",w:"隨機應變",zy:"ㄙㄨㄟˊ ㄐㄧ ㄧㄥˋ ㄅㄧㄢˋ",
mean:"依照當時的情況，靈活調整做法，把事情處理好。",
o:null,n:"這個成語沒有找到特定的故事。意思很像的「臨機應變」，有資料說出自《舊唐書》。",
tg:"《三國演義》故事（幫助你記）",
sg:["曹操請劉備喝酒，突然說：「天下的英雄，只有你和我。」劉備嚇了一大跳，手上的筷子都掉了。","這時剛好打了一聲雷，劉備就說自己是被雷聲嚇到，把心裡的驚慌掩飾過去。這種臨時想辦法的本事，就是「隨機應變」。"],
use:"用在遇到沒想到的狀況，馬上想出辦法處理的時候。",
